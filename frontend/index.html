<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E14" />
    <meta name="description" content="Early warning for low blood sugar" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sonar" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Sonar</title>
    <script>
      // Apply the saved theme before first paint. Only the theme preference is read.
      ;(function () {
        var theme = 'dark'
        try {
          var saved = JSON.parse(localStorage.getItem('sonar.settings') || '{}').theme
          if (saved === 'light') theme = 'light'
          if (saved === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light'
        } catch (e) {
          theme = 'dark'
        }
        document.documentElement.setAttribute('data-theme', theme)
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F6F8FA')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
